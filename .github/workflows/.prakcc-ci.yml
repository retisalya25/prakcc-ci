name: Node CI/CD Pipeline

on:
  push:
    branches: [ "master" ] # Sesuaikan nama branch di sini

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: # Tambahkan ini agar tidak error saat push
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          echo "Disini Build Docker"
          # Gunakan huruf kecil untuk nama image karena GitHub Registry sensitif
          IMAGE_ID=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')
          docker build --pull -t $IMAGE_ID:latest .
          docker push $IMAGE_ID:latest
          echo "Build successfully!"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy step
        run: |
          echo "Disini Deploy Docker"
          echo "Deploy successfully!"